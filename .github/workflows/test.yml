name: E2E Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        channel: [release, beta, dev]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        id: zotero
        with:
          channel: ${{ matrix.channel }}
      - name: Check binary
        shell: bash
        run: |
          if [ -f "${{ steps.zotero.outputs.zotero-bin-path }}" ]; then
            echo "Zotero binary found"
          else
            echo "Zotero binary NOT found at ${{ steps.zotero.outputs.zotero-bin-path }}"
            ls -la "$(dirname "${{ steps.zotero.outputs.zotero-bin-path }}")" || true
            exit 1
          fi
      - name: Check headless
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "DISPLAY=${DISPLAY}"
          if [ "$DISPLAY" = ":99" ]; then
            echo "Headless display configured correctly"
          else
            echo "DISPLAY not set to :99, got: ${DISPLAY}"
            exit 1
          fi
