name: E2E Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        channel: [release, beta, dev]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    outputs:
      version: ${{ steps.out.outputs.version }}
      platform: ${{ steps.out.outputs.platform }}
      binary-ok: ${{ steps.check-binary.outputs.binary-ok }}
      headless-ok: ${{ steps.check-headless.outputs.headless-ok }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        id: zotero
        with:
          channel: ${{ matrix.channel }}
      - name: Set outputs
        id: out
        shell: bash
        run: |
          echo "version=${{ steps.zotero.outputs.zotero-version }}" >> "$GITHUB_OUTPUT"
          echo "platform=${{ steps.zotero.outputs.zotero-platform }}" >> "$GITHUB_OUTPUT"
      - name: Check binary
        id: check-binary
        shell: bash
        run: |
          if [ -f "${{ steps.zotero.outputs.zotero-bin-path }}" ]; then
            echo "binary-ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "binary-ok=false" >> "$GITHUB_OUTPUT"
            echo "Binary not found at ${{ steps.zotero.outputs.zotero-bin-path }}"
            ls -la "$(dirname "${{ steps.zotero.outputs.zotero-bin-path }}")" || true
            exit 1
          fi
      - name: Check headless
        id: check-headless
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          if [ "$DISPLAY" = ":99" ]; then
            echo "headless-ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "headless-ok=false" >> "$GITHUB_OUTPUT"
            echo "Expected DISPLAY=:99, got: ${DISPLAY}"
            exit 1
          fi

  summary:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        env:
          RESULTS: ${{ toJson(needs.test.outputs) }}
        run: |
          echo "$RESULTS" > /tmp/results.json
          python3 << PYEOF
          import json, os

          with open("/tmp/results.json") as f:
              data = json.load(f)

          lines = []
          lines.append("## Zotero Setup E2E Results")
          lines.append("")
          lines.append("| OS | Channel | Version | Platform | Binary | Headless |")
          lines.append("| --- | --- | --- | --- | --- | --- |")

          for key, outputs in sorted(data.items()):
              try:
                  combo = json.loads(key)
              except (json.JSONDecodeError, TypeError):
                  continue
              os_name = combo["os"].replace("-latest", "")
              channel = combo["channel"]
              version = outputs.get("version", "-")
              platform = outputs.get("platform", "-")
              binary = ":white_check_mark:" if outputs.get("binary-ok") == "true" else ":x:"
              hd = outputs.get("headless-ok", "")
              headless = ":white_check_mark:" if hd == "true" else (":x:" if hd else "-")
              lines.append(f"| {os_name} | {channel} | `{version}` | `{platform}` | {binary} | {headless} |")

          if len(lines) <= 4:
              lines.append("| - | - | No results available | - | - | - |")

          summary = "\n".join(lines)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary + "\n")
          PYEOF
